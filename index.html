<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна №5–6 — Завдання 1</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f6fb; padding: 40px 16px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 28px;
                border-radius: 12px; box-shadow: 0 4px 16px #0001; }
        h1 { font-size: 25px; }
        nav { display: flex; gap: 20px; margin: 18px 0; }
        a { color: #1659bd; font-weight: bold; }
        #output { background: #fff2a6; padding: 18px; border-radius: 8px;
                  min-height: 90px; }
        li { margin: 9px 0; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Мови програмування та студенти</h1>
        <nav>
            <a href="#" id="languagesLink">Мови</a>
            <a href="#" id="studentsLink">Студенти</a>
        </nav>
        <div id="output">Натисніть на одне з посилань вище.</div>
        <p><a href="weather.html">Перейти до завдання 2 — Погода</a></p>
    </main>

    <script>
        const output = document.getElementById("output");

        async function loadList(fileName, title) {
            output.textContent = "Завантаження...";
            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error("HTTP " + response.status);

                const items = await response.json();
                if (!Array.isArray(items)) {
                    throw new Error("Очікувався JSON-масив");
                }

                const heading = document.createElement("h2");
                heading.textContent = title;
                const list = document.createElement("ul");

                items.forEach(item => {
                    const li = document.createElement("li");
                    li.textContent = String(item);
                    list.appendChild(li);
                });

                output.replaceChildren(heading, list);
            } catch (error) {
                output.textContent = "Помилка завантаження: " + error.message;
            }
        }

        document.getElementById("languagesLink").addEventListener("click", e => {
            e.preventDefault();
            loadList("1.txt", "Мови програмування");
        });

        document.getElementById("studentsLink").addEventListener("click", e => {
            e.preventDefault();
            loadList("2.txt", "Студенти");
        });
    </script>
</body>
</html>
